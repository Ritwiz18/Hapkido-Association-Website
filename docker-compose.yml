version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: usha_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: usha_hapkido
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usha_hapkido"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Database Migrator (runs once, then exits) ────────────────
  migrate:
    image: node:20-alpine
    container_name: usha_migrate
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/usha_hapkido
    command: sh -c "npm install && npx prisma db push && npx tsx prisma/seed.ts"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ─── Next.js Application ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: usha_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/usha_hapkido
      JWT_SECRET: usha-hapkido-secret-change-in-production-2025
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: production
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Nginx Reverse Proxy (optional, for domain + SSL) ─────────
  nginx:
    image: nginx:alpine
    container_name: usha_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    profiles:
      - production   # only runs with: docker compose --profile production up

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
